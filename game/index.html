<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lompat Neraka — Platformer Sulit tapi Adil</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a4d; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .touch { position: fixed; bottom: 14px; z-index: 10; display: none; gap: 12px; user-select: none; -webkit-user-select: none; }
  .touch.left { left: 14px; }
  .touch.right { right: 14px; }
  .tbtn {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,255,255,0.22); border: 2px solid rgba(255,255,255,0.55);
    color: #fff; font-size: 26px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .tbtn:active { background: rgba(255,255,255,0.45); }
  #btn-jump { width: 84px; height: 84px; background: rgba(255,123,36,0.55); font-size: 15px; }
  @media (pointer: coarse) { .touch { display: flex; } }
  @media (max-width: 700px) { .touch { display: flex; } }
</style>
</head>
<body>
<canvas id="game" width="960" height="540" aria-label="Lompat Neraka: platformer 2D orisinal berbahasa Indonesia"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div class="touch left">
  <div class="tbtn" id="btn-left" aria-label="Kiri">◀</div>
  <div class="tbtn" id="btn-right" aria-label="Kanan">▶</div>
</div>
<div class="touch right">
  <div class="tbtn" id="btn-jump" aria-label="Lompat">LOMPAT</div>
</div>
<button id="btn-start" style="display:none">Mulai</button>
<script type="module" src="./src/main.js"></script>
</body>
</html>
